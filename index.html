<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VOYAGE. — Plan, prepare, go</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f2e7;--card:#fffdf7;--g:#1f4d3a;--o:#e8842c;--t:#22302a;--m:#6b7a71;--l:#e3dccb}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14201a;--card:#1c2b23;--g:#8fd0ac;--o:#f0954a;--t:#eee9db;--m:#a2b1a8;--l:#2e4136}}
:root[data-theme=dark]{--bg:#14201a;--card:#1c2b23;--g:#8fd0ac;--o:#f0954a;--t:#eee9db;--m:#a2b1a8;--l:#2e4136}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;color:var(--g);margin:.2em 0;line-height:1.15}h1{font-size:clamp(2.2rem,6vw,4rem)}h2{font-size:1.9rem}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index5;background:var(--bg);border-bottom:1px solid var(--l);display:flex;align-items:center;gap:16px;padding:12px 20px;z-index:5}
.logo{font:800 1.4rem Georgia,serif;color:var(--g);cursor:pointer}.logo b{color:var(--o)}nav{display:flex;gap:6px;overflow-x:auto;flex:1}nav a{white-space:nowrap;padding:6px 12px;border-radius:99px;cursor:pointer;font-size:.85rem;color:var(--m)}nav a.on{background:var(--g);color:var(--bg)}
main{max-width:980px;margin:0 auto;padding:24px 20px 60px}
.btn{background:var(--o);color:#fff;border:0;border-radius:99px;padding:11px 22px;font:600 1rem inherit;cursor:pointer}.btn.s{background:transparent;color:var(--g);border:1.5px solid var(--g)}.btn.sm{padding:5px 12px;font-size:.8rem}
.card{background:var(--card);border:1px solid var(--l);border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.grid .card{margin:0}
.chip{display:inline-block;padding:6px 14px;border-radius:99px;border:1.5px solid var(--l);margin:3px;cursor:pointer;font-size:.9rem;background:var(--card)}.chip.on{background:var(--g);color:var(--bg);border-color:var(--g)}.tag{font-size:.75rem;color:var(--o);font-weight:600}
input,select{font:inherit;padding:11px 14px;border-radius:12px;border:1.5px solid var(--l);background:var(--card);color:var(--t);width:100%}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}label{font-size:.8rem;color:var(--m);display:block;margin-bottom:3px}
.hero{padding:30px 0}.hero p{color:var(--m);max-width:560px;font-size:1.1rem}.m{color:var(--m);font-size:.88rem}
.bar{height:10px;background:var(--l);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o);transition:width .3s}
.tl{border-left:3px solid var(--o);margin-left:8px;padding-left:18px}.tl .card{position:relative}.tl .card:before{content:"";position:absolute;left:-28px;top:22px;width:13px;height:13px;border-radius:50%;background:var(--o);border:3px solid var(--bg)}
.time{font:700 1.1rem Georgia,serif;color:var(--o)}.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--l)}.it input{width:20px;height:20px;accent-color:var(--g)}.it.d span{text-decoration:line-through;color:var(--m)}
.alert{background:#e8842c22;border:1px solid var(--o);border-radius:14px;padding:12px 16px;margin:8px 0}.ok{border-color:var(--g);background:#1f4d3a18}
.big{font:700 3.5rem Georgia,serif;color:var(--o)}.wx{text-align:center}.wx div{font-size:2rem}
.two{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
@media(max-width:600px){header{padding:10px 12px}}
</style></head><body>
<header><div class="logo" onclick="go(0)">VOYAGE<b>.</b></div><nav id="nav"></nav><button class="btn sm" onclick="reset()">+ New Trip</button></header>
<main id="app"></main>
<script>
const P=(a)=>a.split(';').map(s=>{const[n,t,c]=s.split('|');return{n,t:t.split(','),c:+c}});
const D=[
{id:'ha-long',n:'Hạ Long',pv:'Quảng Ninh',r:'Miền Bắc',tags:['beach','nature','boat','cave','kayak'],pl:P('Vịnh Hạ Long|nature,boat,sightseeing|400;Hang Sửng Sốt|cave,nature,sightseeing|250;Đảo Ti Tốp|beach,swimming,nature|200;Bãi Cháy|beach,relax|100'),tr:P('Du thuyền Hạ Long 1 ngày|boat,relax|1200;Kayak & khám phá hang động|kayak,adventure,cave|700')},
{id:'ha-noi',n:'Hà Nội',pv:'Hà Nội',r:'Miền Bắc',tags:['culture','food','history','city'],pl:P('Phố cổ Hà Nội|culture,food,shopping|150;Hồ Hoàn Kiếm|sightseeing,relax|0;Văn Miếu|culture,history,museum|70;Lăng Chủ tịch Hồ Chí Minh|history,culture|0'),tr:P('Walking & street food tour|food,culture|600;Hà Nội – Ninh Bình day trip|nature,culture|900')},
{id:'sa-pa',n:'Sa Pa',pv:'Lào Cai',r:'Miền Bắc',tags:['mountain','trekking','nature','adventure'],pl:P('Fansipan|mountain,adventure,nature|850;Thung lũng Mường Hoa|trekking,nature|150;Bản Cát Cát|culture,photography|100;Đèo Ô Quy Hồ|nature,photography,adventure|0'),tr:P('Fansipan day trip|adventure,mountain|1100;Village & homestay experience|culture,relax|700')},
{id:'ninh-binh',n:'Ninh Bình',pv:'Ninh Bình',r:'Miền Bắc',tags:['nature','culture','boat','cave'],pl:P('Tràng An|boat,nature,cave|250;Tam Cốc|boat,nature|150;Hang Múa|hiking,photography,nature|100;Chùa Bái Đính|culture,sightseeing|0'),tr:P('Tràng An boat tour|boat,nature|400;Ninh Bình heritage day trip|culture,history|800')},
{id:'da-nang',n:'Đà Nẵng',pv:'Đà Nẵng',r:'Miền Trung',tags:['beach','city','nature','food'],pl:P('Biển Mỹ Khê|beach,swimming,relax|0;Bán đảo Sơn Trà|nature,sightseeing,photography|100;Ngũ Hành Sơn|nature,culture,hiking|60;Cầu Rồng|sightseeing,nightlife,photography|0'),tr:P('Bà Nà Hills & Cầu Vàng|sightseeing,adventure|1000;Đà Nẵng – Hội An evening tour|culture,food,nightlife|600')},
{id:'hoi-an',n:'Hội An',pv:'Quảng Nam',r:'Miền Trung',tags:['culture','food','shopping','relax'],pl:P('Phố cổ Hội An|culture,shopping,food|120;Chùa Cầu|culture,sightseeing|0;Biển An Bàng|beach,relax,swimming|0;Làng rau Trà Quế|nature,culture|100'),tr:P('Walking & food tour|food,culture|500;Basket boat & coconut forest|boat,nature|350;Lantern evening experience|nightlife,culture|200')},
{id:'da-lat',n:'Đà Lạt',pv:'Lâm Đồng',r:'Tây Nguyên',tags:['mountain','trekking','relax','nature','food'],pl:P('Hồ Xuân Hương|relax,sightseeing|0;Thác Datanla|adventure,nature|100;Langbiang|trekking,hiking,nature|80;Vườn hoa Đà Lạt|photography,nature|60'),tr:P('Waterfalls day tour|adventure,nature|700;Food & coffee tour|food,relax|450')},
{id:'nha-trang',n:'Nha Trang',pv:'Khánh Hòa',r:'Miền Trung',tags:['beach','island','relax','swimming'],pl:P('Bãi biển Nha Trang|beach,swimming,relax|0;Hòn Mun|island,swimming,adventure|300;Tháp Bà Ponagar|culture,history|30;Vịnh Nha Trang|boat,nature,island|250'),tr:P('Island hopping & snorkeling|island,swimming,boat|750;Mud bath & wellness|relax|400')},
{id:'phu-quoc',n:'Phú Quốc',pv:'Kiên Giang',r:'Miền Nam',tags:['island','beach','relax','nature'],pl:P('Bãi Trường|beach,relax,swimming|0;Bãi Sao|beach,swimming,photography|0;Hòn Thơm|island,adventure|500;Vườn quốc gia Phú Quốc|nature,hiking|60'),tr:P('Southern islands snorkeling|island,swimming,boat|800;Sunset & night market|nightlife,food,shopping|300')},
{id:'hcm',n:'TP. Hồ Chí Minh',pv:'TP.HCM',r:'Miền Nam',tags:['city','food','history','nightlife','shopping'],pl:P('Chợ Bến Thành|shopping,food,culture|100;Dinh Độc Lập|history,museum,culture|65;Bảo tàng Chứng tích Chiến tranh|history,museum|40;Phố đi bộ Nguyễn Huệ|nightlife,sightseeing|0'),tr:P('Street food motorbike tour|food,nightlife|700;Củ Chi Tunnels day trip|history,adventure|650')}];
const SYN={'biển':'beach','núi':'mountain','ăn':'food','đảo':'island','hang':'cave','thuyền':'boat','văn hóa':'culture','nghỉ':'relax'};
const STY=['Beach','Sightseeing','Food','Culture','Adventure','Relax','Nightlife','Shopping','Nature'],ACT=['Walking','Swimming','Hiking','Museum','Photography','Boat','Shopping'];
const CK={Bookings:['Book transportation','Book hotel','Confirm tour'],'Documents & Money':['Check ID / passport','Prepare cash','Check bank card','Save emergency contacts'],Digital:['Download tickets','Charge power bank','Save hotel address','Download offline map'],Weather:['Check weather forecast']};
const STEPS=['Explore','Preferences','Itinerary','Checklist','Packing','Final Check','On-trip','Recap'];
const def={dest:null,days:3,ppl:2,budget:4000000,bstyle:'Standard',styles:[],acts:[],pace:'Balanced',itin:null,chk:{},pack:null,step:0,cur:0,day:0,q:'',reg:'',fb:''};
let S;try{S={...def,...JSON.parse(localStorage.getItem('voyage')||'{}')}}catch(e){S={...def}}
const save=()=>{try{localStorage.setItem('voyage',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),dest=()=>D.find(d=>d.id===S.dest),vnd=n=>n.toLocaleString('vi-VN')+' VND';
function go(i){S.step=i;save();render();scrollTo(0,0)}
function reset(){S={...def};save();render()}
function search(){const q=S.q.toLowerCase().trim();return D.filter(d=>{if(S.reg&&d.r!==S.reg)return false;if(S.styles.length&&!S.styles.some(s=>d.tags.includes(s.toLowerCase())||d.pl.some(p=>p.t.includes(s.toLowerCase()))))return false;if(!q)return true;const k=[q,...Object.keys(SYN).filter(w=>q.includes(w)).map(w=>SYN[w])];const h=[d.n,d.pv,d.r,...d.tags,...d.pl.map(p=>p.n+' '+p.t.join(' ')),...d.tr.map(t=>t.n+' '+t.t.join(' '))].join(' ').toLowerCase();return k.some(x=>h.includes(x))})}
function gen(){const d=dest(),per={Relaxed:2,Balanced:3,Packed:4}[S.pace],w=S.styles.map(s=>s.toLowerCase()).concat(S.acts.map(a=>a.toLowerCase()));
const pool=[...d.pl,...d.tr].map(p=>({...p,s:p.t.filter(x=>w.includes(x)).length})).sort((a,b)=>b.s-a.s);
const slots=['08:00','11:00','14:30','18:00'],out=[];let k=0;
for(let i=0;i<S.days;i++){const a=[];for(let j=0;j<per&&k<pool.length;j++)a.push({...pool[k++],dur:j?'2 giờ':'3 giờ'});
if(!a.length)a.push({n:'Free time & local food',t:['food','relax'],c:150,dur:'flexible'});
a.forEach((x,j)=>{x.time=slots[Math.min(j,3)]});out.push(a)}
S.itin=out;S.pack=null;S.chk={};S.day=0;}
const WX=i=>[{i:'☀️',t:29,c:'Sunny'},{i:'🌦️',t:27,c:'Possible rain',rain:1},{i:'☀️',t:30,c:'Sunny'}][i%3];
const outdoor=a=>!a.t.every(x=>['food','museum','history','shopping'].includes(x));
function packList(){if(S.pack)return S.pack;const w=S.styles.concat(S.acts).map(x=>x.toLowerCase()),L=[];
const add=(c,n)=>L.push({c,n,on:false});
add('Clothing',`${Math.min(S.days+1,5)} bộ quần áo`);add('Clothing','Đồ ngủ & đồ lót');add('Clothing','Áo khoác nhẹ');
['Điện thoại & sạc','Ví','CCCD / hộ chiếu','Chìa khóa'].forEach(n=>add('Essentials',n));
for(let i=0;i<S.days;i++)if(WX(i).rain){add('Weather','Áo mưa');add('Weather','Ô / túi chống nước');break}
add('Weather','Kem chống nắng');add('Weather','Kính râm & mũ');
if(w.some(x=>['swimming','beach','island'].includes(x))||dest().tags.includes('beach')){add('Activity','Đồ bơi');add('Activity','Khăn tắm')}
if(w.some(x=>['hiking','trekking','adventure','mountain'].includes(x))){add('Activity','Giày trekking');add('Activity','Bình nước & balo nhỏ')}
if(w.includes('photography'))add('Activity','Máy ảnh / pin dự phòng');
add('Essentials','Power bank');S.pack=L;return L}
function scores(){const c=Object.values(CK).flat(),p=packList(),pc=p.filter(x=>x.on).length/p.length,ck=c.filter(x=>S.chk[x]).length/c.length,b=CK.Bookings.filter(x=>S.chk[x]).length/3,w=S.chk['Check weather forecast']?1:0;return{ck,pc,b,w,tot:Math.round((ck+pc+b+w)/4*100)}}
const lvl=n=>n<50?'Not ready yet':n<80?'Getting ready':n<100?'Almost ready':'Ready to go!';
function render(){$('nav').innerHTML=STEPS.map((s,i)=>`<a class="${i===S.step?'on':''}" onclick="go(${i})">${s}</a>`).join('');$('app').innerHTML=[p0,p1,p2,p3,p4,p5,p6,p7][S.step]()}
const chips=(arr,key,max)=>arr.map(x=>`<span class="chip ${S[key].includes(x)?'on':''}" onclick="tog('${key}','${x}',${max||9})">${x}</span>`).join('');
function tog(k,v,m){const a=S[k],i=a.indexOf(v);i>=0?a.splice(i,1):a.length<m&&a.push(v);save();k==='styles'&&S.step===0?refresh():render()}
function refresh(){const q=$('q');const pos=q&&q.selectionStart;render();const n=$('q');if(n&&document.activeElement!==n&&S.q){n.focus();n.setSelectionRange(pos,pos)}}
function p0(){const r=search();return`<div class="hero"><span class="tag">TRAVEL PLANNING & SMART PREPARATION</span><h1>Your trip, ready for reality.</h1><p>Plan your destination, build your itinerary, prepare your essentials and get ready to go — all in one place.</p></div>
<input id="q" placeholder="Where do you want to go? (thử: biển, trekking, food, kayak, Hang Múa)" value="${S.q}" oninput="S.q=this.value;refresh()">
<div style="margin:10px 0"><select style="width:auto" onchange="S.reg=this.value;render()"><option value="">Mọi khu vực</option>${['Miền Bắc','Miền Trung','Tây Nguyên','Miền Nam'].map(x=>`<option ${S.reg===x?'selected':''}>${x}</option>`).join('')}</select> ${chips(STY,'styles',4)}</div>
<div class="grid">${r.map(d=>`<div class="card" style="${S.dest===d.id?'border:2px solid var(--o)':''}"><span class="tag">${d.pv} · ${d.r}</span><h3>${d.n}</h3><div>${d.tags.slice(0,4).map(t=>`<span class="chip" style="cursor:default;padding:2px 10px">${t}</span>`).join('')}</div><p class="m"><b>Địa điểm:</b> ${d.pl.slice(0,3).map(p=>p.n).join(' · ')}<br><b>Trải nghiệm:</b> ${d.tr.map(t=>t.n).join(' · ')}</p><button class="btn sm" onclick="S.dest='${d.id}';save();render()">Select destination</button></div>`).join('')||'<p class="m">Không tìm thấy kết quả.</p>'}</div>
${S.dest?`<div class="card"><h3>Trip basics — ${dest().n}</h3><div class="row"><div><label>Số ngày</label><input type="number" min="1" max="7" value="${S.days}" onchange="S.days=Math.max(1,Math.min(7,+this.value||1));save()"></div><div><label>Số người</label><input type="number" min="1" value="${S.ppl}" onchange="S.ppl=+this.value||1;save()"></div><div><label>Ngân sách (VND)</label><input type="number" step="100000" value="${S.budget}" onchange="S.budget=+this.value||0;save()"></div><div><label>Mức chi tiêu</label><select onchange="S.bstyle=this.value;save()">${['Economy','Standard','Premium'].map(x=>`<option ${S.bstyle===x?'selected':''}>${x}</option>`).join('')}</select></div></div><p><button class="btn" onclick="go(1)">Continue →</button></p></div>`:''}`}
function p1(){if(!S.dest)return need();return`<h2>How do you want to travel?</h2><div class="card"><h3>Travel style <span class="m">(chọn 2–4)</span></h3>${chips(STY,'styles',4)}<h3>Activities</h3>${chips(ACT,'acts')}<h3>Pace</h3>${[['Relaxed','Ít địa điểm, nhiều nghỉ ngơi'],['Balanced','Cân bằng tham quan & nghỉ'],['Packed','Nhiều địa điểm, tối ưu thời gian']].map(([p,d])=>`<span class="chip ${S.pace===p?'on':''}" onclick="S.pace='${p}';save();render()"><b>${p}</b> · ${d}</span>`).join('')}</div>
<div class="card m">${dest().n} · ${S.days} days · ${S.ppl} travelers · ${vnd(S.budget)}</div><button class="btn" onclick="if(S.styles.length<1){alert('Chọn ít nhất 1 phong cách');return}gen();$('app').innerHTML='<h2 style=\\'text-align:center;padding:80px 0\\'>Building your perfect itinerary…</h2>';setTimeout(()=>go(2),900)">Create my trip →</button>`}
const need=()=>`<div class="card"><p>Hãy chọn điểm đến trước.</p><button class="btn" onclick="go(0)">Explore</button></div>`;
function head(){const d=dest(),s=scores();return`<div class="two"><div><span class="tag">${S.days} DAYS · ${S.ppl} TRAVELERS</span><h2>${d.n.toUpperCase()}</h2><span class="m">Budget ${vnd(S.budget)}</span></div><div style="text-align:right"><div class="big" style="font-size:2.2rem">${s.tot}%</div><span class="m">READY</span></div></div>`}
function dayTabs(){return`<div>${S.itin.map((_,i)=>`<span class="chip ${S.day===i?'on':''}" onclick="S.day=${i};render()">Day 0${i+1}</span>`).join('')}</div>`}
function cost(){return S.itin.flat().reduce((a,x)=>a+x.c*S.ppl,0)}
function p2(){if(!S.itin)return need();const a=S.itin[S.day],d=dest(),c=cost();return head()+dayTabs()+`<div class="tl">${a.map((x,i)=>`<div class="card"><span class="time">${x.time}</span><h3>${x.n}</h3><span class="tag">${x.t.join(' · ')}</span><p class="m">Duration: ${x.dur} · ${i?'Di chuyển ~15 phút':'Điểm bắt đầu'} · ~${vnd(x.c*S.ppl)}</p><button class="btn s sm" onclick="swap(${i})">Swap</button></div>`).join('')}</div><div class="card ${c>S.budget?'alert':'ok'}">Chi phí hoạt động ước tính: <b>${vnd(c)}</b> / ngân sách ${vnd(S.budget)} (chưa gồm ăn ở, di chuyển)${c>S.budget?' — vượt ngân sách, hãy thử Swap hoạt động rẻ hơn.':'.'}</div><button class="btn" onclick="go(3)">Prepare →</button>`}
function swap(i){const d=dest(),used=S.itin.flat().map(x=>x.n),cur=S.itin[S.day][i],alt=[...d.pl,...d.tr].filter(x=>!used.includes(x.n)).map(x=>({...x,s:x.t.filter(t=>cur.t.includes(t)).length})).sort((a,b)=>b.s-a.s||a.c-b.c)[0];
if(!alt)return alert('Không còn hoạt động thay thế cho điểm đến này.');if(confirm(`Thay "${cur.n}" bằng "${alt.n}"?\nLý do: ${alt.s?'trải nghiệm tương tự':'không trùng lặp'}, chi phí ~${vnd(alt.c*S.ppl)}.`)){S.itin[S.day][i]={...alt,time:cur.time,dur:cur.dur};save();render()}}
function ckt(k,v){S.chk[k]=v;save();render()}
function p3(){if(!S.dest)return need();const s=scores(),all=Object.values(CK).flat(),n=all.filter(x=>S.chk[x]).length;return`<h2>Get ready before you go.</h2><p class="m">${n} / ${all.length} completed</p><div class="bar"><i style="width:${s.ck*100}%"></i></div>${Object.entries(CK).map(([g,l])=>`<div class="card"><h3>${g}</h3>${l.map(x=>`<label class="it ${S.chk[x]?'d':''}"><input type="checkbox" ${S.chk[x]?'checked':''} onchange="ckt('${x}',this.checked)"><span>${x}</span></label>`).join('')}</div>`).join('')}<button class="btn" onclick="go(4)">Pack →</button>`}
function pk(i,v){S.pack[i].on=v;save();render()}
function p4(){if(!S.dest)return need();const L=packList(),cats=[...new Set(L.map(x=>x.c))];return`<h2>Smart packing list</h2><p class="m">Tạo theo điểm đến, số ngày, thời tiết & hoạt động. ${L.filter(x=>x.on).length}/${L.length} đã chuẩn bị.</p>${cats.map(c=>`<div class="card"><h3>${c}</h3>${L.map((x,i)=>x.c===c?`<div class="it ${x.on?'d':''}"><input type="checkbox" ${x.on?'checked':''} onchange="pk(${i},this.checked)"><span style="flex:1">${x.n}</span><a class="m" style="cursor:pointer" onclick="S.pack.splice(${i},1);save();render()">✕</a></div>`:'').join('')}</div>`).join('')}<div class="card"><div class="row"><input id="ni" placeholder="Thêm món đồ…"><button class="btn s" onclick="const v=$('ni').value.trim();if(v){S.pack.push({c:'Essentials',n:v,on:false});save();render()}">Add item</button></div></div><button class="btn" onclick="go(5)">Final check →</button>`}
function p5(){if(!S.itin)return need();const s=scores(),p=packList(),al=[];
S.itin.forEach((a,i)=>{const w=WX(i);if(w.rain&&a.some(outdoor))al.push(`<div class="alert">⚠️ <b>Rain is expected on Day ${i+1}.</b> Your itinerary includes outdoor activities (${a.filter(outdoor).map(x=>x.n).join(', ')}). Consider moving them to a sunny day.</div>`)});
const rj=p.findIndex(x=>x.n==='Áo mưa');if(rj>=0&&!p[rj].on)al.push(`<div class="alert">⚠️ You haven't packed a rain jacket. <button class="btn sm" onclick="pk(${rj},true)">Add rain jacket</button></div>`);
const f=[['Transportation',S.chk['Book transportation']],['Hotel',S.chk['Book hotel']],['Documents',S.chk['Check ID / passport']],['Money',S.chk['Prepare cash']],['Weather',S.chk['Check weather forecast']],['Packing',s.pc===1],['Itinerary',!!S.itin]];
return`<h2>Weather, alerts & final check</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">${S.itin.map((_,i)=>{const w=WX(i);return`<div class="card wx"><span class="m">DAY ${i+1}</span><div>${w.i}</div><b>${w.t}°C</b><br><span class="m">${w.c}</span></div>`}).join('')}</div><p class="m">* Dữ liệu thời tiết mô phỏng cho prototype.</p>${al.join('')||'<div class="alert ok">✓ Không có cảnh báo nào.</div>'}
<div class="card"><h3>Final check</h3>${f.map(([n,v])=>`<div class="it">${v?'✅':'⬜'} <span>${n}</span></div>`).join('')}</div>
<div class="card" style="text-align:center"><div class="big">${s.tot}%</div><h3>${lvl(s.tot)}</h3>${s.tot===100?'<p><b>You\'re ready to go.</b></p>':''}<div class="bar"><i style="width:${s.tot}%"></i></div><p class="m">Checklist ${Math.round(s.ck*100)}% · Packing ${Math.round(s.pc*100)}% · Booking ${Math.round(s.b*100)}% · Weather ${s.w*100}%</p></div><button class="btn" onclick="go(6)">Start trip →</button>`}
function p6(){if(!S.itin)return need();const a=S.itin[S.day],i=Math.min(S.cur,a.length-1),x=a[i],n=a[i+1];return`<h2>On-trip mode</h2>${dayTabs().replace(/S\.day=(\d)/g,'S.day=$1;S.cur=0')}<div class="card" style="border:2px solid var(--o)"><span class="tag">NOW</span><h1 style="font-size:2rem">${x.n}</h1><p class="m">${x.time} · ${x.dur}</p><button class="btn sm" onclick="window.open('https://www.google.com/maps/search/'+encodeURIComponent('${x.n} ${dest().n}'),'_blank')">Get directions →</button></div>${n?`<div class="card"><span class="tag">NEXT</span><h3>${n.n}</h3><p class="m">${n.time} · Next activity in ${(+n.time.slice(0,2)*60+ +n.time.slice(3))-(+x.time.slice(0,2)*60+ +x.time.slice(3))} min (từ giờ bắt đầu hoạt động hiện tại)</p></div>`:'<div class="card">🎉 Hết lịch trình hôm nay.</div>'}<div class="card"><h3>Today</h3>${a.map((y,j)=>`<div class="it" style="${j===i?'font-weight:700;color:var(--o)':''}">${y.time} — ${y.n}</div>`).join('')}</div>${n?`<button class="btn" onclick="S.cur=${i+1};render()">Done · next ▶</button>`:`<button class="btn" onclick="go(7)">Finish trip →</button>`}`}
function p7(){if(!S.itin)return need();const a=S.itin.flat(),d=dest();return`<h2>Your trip, completed.</h2><div class="card" style="background:var(--g);color:var(--bg);text-align:center"><span class="tag" style="color:var(--o)">${S.days} DAYS · ${S.ppl} TRAVELERS · READY ${scores().tot}%</span><h1 style="color:var(--bg)">${d.n.toUpperCase()}</h1><p>${S.styles.join(' · ')||d.tags.slice(0,3).join(' · ')}<br>${a.length} activities · ${new Set(a.map(x=>x.n)).size} places · ~${vnd(cost())}</p></div><div class="card"><h3>Feedback</h3>${['😍 Very useful','🙂 Easy to use','🧭 Good itinerary','💡 Needs improvement'].map(f=>`<span class="chip ${S.fb===f?'on':''}" onclick="S.fb='${f}';save();render()">${f}</span>`).join('')}${S.fb?'<p class="m">Cảm ơn bạn đã phản hồi!</p>':''}</div><button class="btn s" onclick="go(2)">View trip</button> <button class="btn s" onclick="S.chk={};S.pack=null;go(3)">Duplicate trip</button> <button class="btn" onclick="reset()">Plan another trip</button>`}
render();
</script></body></html>
